# Personal-RU: сгенерировано из config/routing-template.json.
# Для 3x-ui → Подписка → Clash/Mihomo → Глобальные правила маршрутизации.
# VPN-узлы добавляет панель. DNS/TUN настраиваются отдельно.
proxy-groups:
- name: PROXY
  type: select
  proxies:
  - AUTO
  include-all: true
- name: AUTO
  type: url-test
  include-all: true
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
  lazy: true
rule-providers:
  geosite-win-spy:
